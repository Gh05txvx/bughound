name: docker

# When a version tag is pushed, build the image and push it to the GitHub Container
# Registry (ghcr.io). Three variants from one multi-target Dockerfile:
#   - full (default): DAST + SAST  -> the main tags (vX.Y.Z, X.Y, latest)
#   - dast          : recon + DAST -> a -dast-suffixed tag (e.g. 0.5.0-dast)
#   - sast          : SAST only    -> a -sast-suffixed tag (e.g. 0.5.0-sast)
# All variants are lean (no ZAP); ZAP can still be built locally with
# --build-arg WITH_ZAP=true; FindSecBugs with --build-arg WITH_FINDSECBUGS=true.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: full
            flavor: latest=true
          - target: dast
            flavor: |
              latest=false
              suffix=-dast
          - target: sast
            flavor: |
              latest=false
              suffix=-sast
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tag & label) — ${{ matrix.target }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: ${{ matrix.flavor }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build & push — ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
