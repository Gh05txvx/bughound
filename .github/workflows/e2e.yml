name: e2e

# E2E Playwright: alur pengguna lewat browser, engine MOCK, egress diblok.
# Tidak pernah menyentuh aset eksternal (lihat e2e/README.md).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # Hangatkan cache modul Go supaya `go build` di dalam webServer (yang
      # berjalan dengan env proxy mati) hanya meng-compile, tanpa jaringan.
      - name: Warm Go build cache
        run: go build ./cmd/bughound

      - name: Run E2E
        working-directory: e2e
        run: npm test

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
