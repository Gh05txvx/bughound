id: bh-exposed-git-config

info:
  name: Exposed .git/config (VCS metadata disclosure)
  author: bughound
  severity: medium
  description: |
    The .git directory is exposed in the webroot. The .git/config file can be fetched without
    authentication, leaking the remote URL, branch names, and sometimes embedded
    credentials. The whole source tree can often be reconstructed from the .git directory.
    READ-ONLY detection: a single GET, with no writing/changing of target state.
  reference:
    - https://owasp.org/www-community/attacks/Code_Review_of_Git_Repositories
    - https://cwe.mitre.org/data/definitions/538.html
  classification:
    cwe-id: CWE-538
  tags: exposure,git,config,misconfig,bughound

http:
  - method: GET
    path:
      - "{{BaseURL}}/.git/config"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "[core]"
          - "repositoryformatversion"
        condition: and
      - type: status
        status:
          - 200
