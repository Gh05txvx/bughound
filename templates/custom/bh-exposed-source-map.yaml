id: bh-exposed-source-map

info:
  name: Exposed JavaScript source map (.js.map)
  author: bughound
  severity: low
  description: |
    A JavaScript source map file (.js.map) is reachable without authentication.
    A source map maps the production bundle back to the original source (original
    TypeScript/ES, variable names, sometimes internal paths & comments), which makes code
    analysis and vulnerability discovery easier. It generally should not be deployed to
    production. READ-ONLY detection: GET; match the JSON Source Map v3 structure
    (structural markers), rather than siphoning sensitive values into evidence.
  reference:
    - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/01-Information_Gathering/
    - https://cwe.mitre.org/data/definitions/540.html
  classification:
    cwe-id: CWE-540
  tags: exposure,sourcemap,disclosure,js,bughound

http:
  - method: GET
    path:
      - "{{BaseURL}}/main.js.map"
      - "{{BaseURL}}/polyfills.js.map"
      - "{{BaseURL}}/runtime.js.map"
      - "{{BaseURL}}/vendor.js.map"
      - "{{BaseURL}}/bundle.js.map"
      - "{{BaseURL}}/app.js.map"
      - "{{BaseURL}}/scripts.js.map"
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      # JSON Source Map v3 structure: "version":3 + "mappings" + "sources".
      - type: regex
        part: body
        regex:
          - "\"version\"\\s*:\\s*3"
      - type: word
        part: body
        words:
          - "\"mappings\""
          - "\"sources\""
        condition: and
      - type: status
        status:
          - 200
      # Avoid SPA/catch-all false positives that return HTML for every path.
      - type: word
        part: header
        words:
          - "text/html"
        negative: true
