id: bh-exposed-env-file

info:
  name: Exposed .env file (environment secrets disclosure)
  author: bughound
  severity: high
  description: |
    The application .env file is exposed in the webroot and can be fetched without authentication.
    It usually holds database credentials, API keys, and other application
    secrets. READ-ONLY detection: a single GET; match the key pattern at the start of a line,
    not its value, so secrets are not dragged into evidence more than needed.
  reference:
    - https://owasp.org/Top10/A05_2021-Security_Misconfiguration/
    - https://cwe.mitre.org/data/definitions/200.html
  classification:
    cwe-id: CWE-200
  tags: exposure,env,secret,misconfig,bughound

http:
  - method: GET
    path:
      - "{{BaseURL}}/.env"
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "(?m)^\\s*(APP_KEY|APP_ENV|DB_(HOST|PORT|USERNAME|PASSWORD|DATABASE)|AWS_(ACCESS_KEY_ID|SECRET_ACCESS_KEY)|SECRET_KEY|API_?KEY|JWT_SECRET)\\s*="
      - type: status
        status:
          - 200
      # Avoid SPA/catch-all false positives that return HTML for every path.
      - type: word
        part: header
        words:
          - "text/html"
        negative: true
