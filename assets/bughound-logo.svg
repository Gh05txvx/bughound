<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="bughound logo: a hound dog head sniffing a bug">
  <title>bughound</title>
  <desc>Logo bughound minimalis: kepala anjing pelacak tampak depan-bawah dengan telinga panjang menggantung, moncong menunduk ke seekor serangga kuning.</desc>
  <defs>
    <style>
      .bg     { fill: #0F3B34; }
      .fur    { fill: #35B79A; }
      .fur-d  { fill: #2A9580; }
      .accent { fill: #F0B341; }
      .dark   { fill: #0F3B34; }
    </style>
  </defs>

  <!-- Rounded badge -->
  <rect x="6" y="6" width="244" height="244" rx="58" class="bg"/>

  <!-- ============ EARS: two long floppy hound ears, clearly separate ============ -->
  <path class="fur-d" d="M96 76
    C68 72 50 92 52 124
    C54 150 68 170 88 176
    C92 156 94 128 96 106
    C97 92 97 82 96 76 Z"/>
  <path class="fur-d" d="M160 76
    C188 72 206 92 204 124
    C202 150 188 170 168 176
    C164 156 162 128 160 106
    C159 92 159 82 160 76 Z"/>

  <!-- ============ HEAD: rounded dome, front-facing ============ -->
  <path class="fur" d="M128 62
    C158 62 182 84 182 120
    C182 142 174 160 160 172
    L96 172
    C82 160 74 142 74 120
    C74 84 98 62 128 62 Z"/>

  <!-- ============ MUZZLE: rounded snout hanging down, lighter ============ -->
  <path class="fur-d" d="M128 150
    C146 150 158 164 158 184
    C158 202 146 214 128 214
    C110 214 98 202 98 184
    C98 164 110 150 128 150 Z"/>

  <!-- Eyes -->
  <circle class="dark" cx="110" cy="116" r="9"/>
  <circle class="dark" cx="146" cy="116" r="9"/>
  <circle class="fur" cx="113" cy="113" r="2.6"/>
  <circle class="fur" cx="149" cy="113" r="2.6"/>

  <!-- Nose on muzzle, pointing down to the bug -->
  <ellipse class="dark" cx="128" cy="180" rx="13" ry="11"/>
  <circle class="fur-d" cx="124" cy="177" r="2.3" opacity="0.8"/>
  <!-- mouth line -->
  <path d="M128 191 L128 200 M128 200 C122 204 116 204 112 200 M128 200 C134 204 140 204 144 200"
        fill="none" stroke="#0F3B34" stroke-width="3" stroke-linecap="round"/>

  <!-- ============ SCENT DASHES from nose toward bug ============ -->
  <g fill="none" stroke="#F0B341" stroke-width="4.5" stroke-linecap="round" opacity="0.9">
    <path d="M118 222 C124 226 132 226 138 222"/>
  </g>

  <!-- ============ BUG directly below, clear ladybug ============ -->
  <g transform="translate(128 234)">
    <g stroke="#F0B341" stroke-width="4.5" stroke-linecap="round" fill="none">
      <path d="M-9 -5 L-20 -12"/>
      <path d="M-11 1 L-23 1"/>
      <path d="M-9 7 L-20 14"/>
      <path d="M9 -5 L20 -12"/>
      <path d="M11 1 L23 1"/>
      <path d="M9 7 L20 14"/>
    </g>
    <ellipse class="accent" cx="0" cy="0" rx="15" ry="12.5"/>
    <path d="M0 -12.5 L0 12.5" stroke="#0F3B34" stroke-width="3"/>
    <circle class="dark" cx="-6" cy="-3" r="2.6"/>
    <circle class="dark" cx="6" cy="-3" r="2.6"/>
    <circle class="dark" cx="-6" cy="5" r="2.6"/>
    <circle class="dark" cx="6" cy="5" r="2.6"/>
    <circle class="accent" cx="0" cy="-15" r="5.5"/>
    <path d="M-2.5 -18.5 L-7 -24" stroke="#F0B341" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M2.5 -18.5 L7 -24" stroke="#F0B341" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
</svg>
