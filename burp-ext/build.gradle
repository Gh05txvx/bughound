// Build the bughound Burp extension (Montoya API) -> one load-ready jar.
//
// Burp provides the Montoya API at runtime, so 'compileOnly' (not bundled).
// Gson IS BUNDLED (shadow) because Burp does not provide it.
//
// Build:  gradle shadowJar   (or ./gradlew shadowJar once the wrapper exists)
// Result: build/libs/bughound-burp.jar  -> load in Burp (Extensions -> Add -> Java)

plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'bughound.burp'
version = '0.1.0'

repositories {
    mavenCentral()
}

java {
    // Modern Burp runs on JDK 17+. Adjust if needed.
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// The source uses non-ASCII text (ellipsis), so force UTF-8 at compile time.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    // The Burp API, provided by Burp at runtime, do not bundle it.
    // Bump to the latest on Maven Central if needed; the core API is stable.
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2023.12.1'

    // JSON parser, bundled into the jar via shadow.
    implementation 'com.google.code.gson:gson:2.10.1'
}

shadowJar {
    archiveBaseName = 'bughound-burp'
    archiveClassifier = ''
    archiveVersion = ''
}

// `gradle build` also produces the shadow jar that gets loaded into Burp.
build.dependsOn shadowJar
