{{define "base"}}<!doctype html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bughound · {{.Title}}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="logo">🐾</span> bughound</div>
      <nav>
        <a href="/scan" class="{{if eq .Nav "scan"}}active{{end}}">Scan</a>
        <a href="/findings{{if .Program}}?program={{.Program}}{{end}}" class="{{if eq .Nav "findings"}}active{{end}}">Findings</a>
        <a href="/report{{if .Program}}?program={{.Program}}{{end}}" class="{{if eq .Nav "report"}}active{{end}}">Reports</a>
      </nav>
      <div class="sidebar-foot">
        <div class="muted small">M0 · fondasi</div>
        <div class="pill st-confirmed small">scope guard aktif</div>
        <div class="muted small">engine: mock (tanpa jaringan)</div>
      </div>
    </aside>
    <main class="content">
      <header class="topbar">
        <div class="title">{{.Title}}</div>
        {{if .Program}}<div class="muted small">program: <b>{{.Program}}</b></div>{{end}}
      </header>
      <section class="bodywrap">
        {{template "content" .}}
      </section>
    </main>
  </div>
</body>
</html>{{end}}
