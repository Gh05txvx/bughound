{{define "content"}}
<div class="grid-2">
  <form class="card" hx-post="/scan" hx-target="#result" hx-swap="innerHTML"
        hx-confirm="Mulai scan terhadap target in-scope? Hanya target yang lolos scope guard yang akan disentuh.">
    <h2>Konfigurasi scan</h2>

    <label>Program</label>
    <input type="text" name="program" value="{{.Program}}" autocomplete="off" required>

    <label>Seed domain untuk recon <span class="muted small">(opsional · subfinder→httpx→katana, mock — hasilnya tetap disaring scope guard)</span></label>
    <textarea name="seeds" rows="2" spellcheck="false">{{.Seeds}}</textarea>

    <label>In-scope <span class="muted small">(satu entri per baris · domain, *.wildcard, URL, IP, CIDR)</span></label>
    <textarea name="in_scope" rows="4" spellcheck="false">{{.InScope}}</textarea>

    <label>Out-of-scope <span class="muted small">(menang atas in-scope)</span></label>
    <textarea name="out_scope" rows="3" spellcheck="false">{{.OutScope}}</textarea>

    <label>Target <span class="muted small">(satu per baris)</span></label>
    <textarea name="targets" rows="4" spellcheck="false">{{.Targets}}</textarea>

    <label>OpenAPI/Swagger spec <span class="muted small">(opsional · tempel JSON/YAML · tiap endpoint jadi target &amp; tetap lewat scope guard)</span></label>
    <textarea name="openapi" rows="3" spellcheck="false" placeholder="tempel isi openapi.json / swagger.yaml (OpenAPI 3 / Swagger 2)">{{.OpenAPI}}</textarea>

    <label>Rate limit <span class="muted small">(request/detik · wajib di jalur eksekusi, dijepit maks 50)</span></label>
    <input type="text" name="rps" value="{{.RPS}}" autocomplete="off">

    <label>Upstream proxy <span class="muted small">(opsional · egress engine diteruskan ke sini SETELAH lolos scope guard)</span></label>
    <input type="text" name="upstream_proxy" value="{{.UpstreamProxy}}" autocomplete="off" placeholder="http://127.0.0.1:8080 · https://… · socks5://127.0.0.1:9050">

    <div class="actions">
      <button type="submit" class="btn primary">Jalankan scan</button>
      <span class="muted small">tanpa auto-submit · report selalu draft</span>
    </div>
  </form>

  <div class="card">
    <h2>Hasil</h2>
    <div id="result">
      {{if .Result}}{{template "scan_result" .}}{{else}}
      <p class="muted">Isi scope &amp; target, lalu jalankan scan. Scope guard akan menolak target di luar scope sebelum engine berjalan.</p>
      {{end}}
    </div>
  </div>
</div>
{{end}}
