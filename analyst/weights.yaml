# Decision-support (SAW) weights & mappings. Σ weights must = 1.0 (validated at load).
# Everything here is TUNABLE without code changes, the heart of "explainable decision support".

weights:
  exploitability: 0.26   # C1 benefit: conf × engine activeness
  signal:         0.22   # C2 benefit: payout signal per class (anti header-noise)
  bounty:         0.16   # C3 benefit: bounty potential (scope max_severity when present)
  severity:       0.12   # C4 benefit: scanner severity (deliberately low: often inflated for passive)
  fp_likelihood:  0.12   # C5 cost
  effort:         0.06   # C6 cost
  owasp:          0.04   # C7 benefit
  freshness:      0.02   # C8 benefit

# Criterion types: benefit (bigger is better) / cost (smaller is better).
types:
  exploitability: benefit
  signal:         benefit
  bounty:         benefit
  severity:       benefit
  fp_likelihood:  cost
  effort:         cost
  owasp:          benefit
  freshness:      benefit

# Engine-activeness factor for C1 exploitability.
engine_factor:
  nuclei-dast: 1.0
  dalfox:      1.0
  nuclei:      0.8
  zap:         0.8
  ffuf:        0.7
  retire:      0.5
  zap-passive: 0.5
  sast:        0.5
  _default:    0.6

# Payout signal (C2) per vulnerability class, substring match (lowercase) over
# type+title+tags. high->1.0 (exploitable/paid), noise->0.1 (hygiene/header,
# almost won't-pay in bug bounty), otherwise 0.5. The main anti header-noise lever.
signal_patterns:
  high:
    - sqli
    - sql-injection
    - nosql
    - xss
    - cross-site-scripting
    - rce
    - remote-code
    - command-injection
    - os-command
    - ssrf
    - server-side-request
    - xxe
    - xml-external
    - idor
    - bola
    - broken-access
    - authorization-bypass
    - auth-bypass
    - authentication-bypass
    - login-bypass
    - path-traversal
    - directory-traversal
    - lfi
    - local-file
    - rfi
    - remote-file
    - deserial
    - ssti
    - template-injection
    - prototype-pollution
    - exposed-panel
    - exposed-admin
    - admin-panel
    - exposed-config
    - config-exposure
    - backup-file
    - .git
    - git-config
    - .env
    - env-file
    - secret
    - api-key
    - apikey
    - access-key
    - private-key
    - credential
    - token-leak
    - hardcoded
    - takeover
    - subdomain-takeover
    - unrestricted-upload
    - file-upload
    # juicy paths (also matched against the URL path via the signal `extra`):
    - backup
    - .sql
    - .bak
    - .svn
    - wp-admin
    - phpmyadmin
    - actuator
  noise:
    - content-security-policy
    - csp
    - sub-resource-integrity
    - subresource-integrity
    - clickjacking
    - anti-clickjacking
    - x-frame
    - frame-options
    - strict-transport
    - hsts
    - samesite
    - cookie-with
    - cookie-without
    - httponly
    - secure-flag
    - referrer-policy
    - permissions-policy
    - feature-policy
    - x-content-type
    - content-type-options
    - nosniff
    - x-xss-protection
    - x-powered-by
    - server-version
    - banner
    - version-disclosure
    - timestamp-disclosure
    - cache-control
    - mixed-content
    - autocomplete
    - cross-domain-javascript
    - cross-domain-script
    - tls-version
    - deprecated-tls
    - weak-cipher
    - ssl-certificate
    - self-signed
    - private-ip-disclosure
    - internal-ip
    - viewstate
  # "boring" paths: standard files (not vulnerabilities), which drop a NEUTRAL
  # exposed-path to noise so a real endpoint (/search, /signup) rises above static files.
  boring:
    - robots.txt
    - sitemap
    - favicon
    - .well-known
    - security.txt
    - humans.txt
    - healthz
    - health
    - manifest.json
    - service-worker
    - crossdomain.xml
    - ads.txt

# OWASP 2021 category priority (C7), scale 1..5.
owasp_priority:
  A01: 5   # Broken Access Control
  A02: 4   # Cryptographic Failures
  A03: 5   # Injection
  A04: 3   # Insecure Design
  A05: 3   # Security Misconfiguration
  A06: 3   # Vulnerable & Outdated Components
  A07: 4   # Identification & Authentication Failures
  A08: 3   # Software & Data Integrity Failures
  A09: 2   # Security Logging & Monitoring Failures
  A10: 4   # SSRF
  _default: 2

# Verification-effort estimate (C6) per type, substring match, lowercase.
effort_by_type:
  reflected:    1
  xss:          1
  sqli:         2
  injection:    2
  idor:         2
  access:       2
  blind:        3
  second-order: 3
  ssrf:         3
  _default:     2

# Heuristic priors (tunable). An ffuf flood = many exposed-paths on one host ->
# probably soft-404/wildcard (the server answers 200 for nearly every path) -> fp raised.
heuristics:
  ffuf_flood_threshold: 8   # >=N ffuf exposed-paths per host triggers the prior
  ffuf_flood_fp: 0.6        # the minimum fp_likelihood forced during a flood
